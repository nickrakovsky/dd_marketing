name: Scheduled Blog Publish

on:
  schedule:
    # Fixed PST (UTC-8): 06:30 PST = 14:30 UTC, Monday through Friday.
    # GitHub may delay scheduled runs; articles go live when the build completes.
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

concurrency:
  group: "scheduled-publish"
  cancel-in-progress: false

jobs:
  publish:
    name: Trigger Scheduled Cloudflare Build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages Deploy Hook
        env:
          HOOK_URL: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::Secret CF_PAGES_DEPLOY_HOOK is not set! Please add it in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Sending POST request to Cloudflare Pages deploy hook..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$HOOK_URL")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Successfully triggered Cloudflare Pages build! (HTTP $HTTP_CODE)"
          else
            echo "::error::Deploy hook returned HTTP $HTTP_CODE: $BODY"
            exit 1
          fi
