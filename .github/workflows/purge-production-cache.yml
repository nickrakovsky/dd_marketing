name: Purge production website cache

on:
  # Cloudflare publishes Checks, including dashboard redeploys. GitHub can
  # suppress this event for Actions-created commits, so CI completion is a fallback.
  check_run:
    types: [completed]
  workflow_run:
    workflows: ['CI – Quality Gate']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: purge-datadocks-apex-cache
  cancel-in-progress: false

jobs:
  purge:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'check_run' &&
       github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
       github.event.check_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Never execute a preview/PR checkout or consume artifacts with purge credentials.
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Verify production deployment and purge datadocks.com only
        run: node scripts/purge-production-cache.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_PURGE_API_TOKEN: ${{ secrets.CF_PURGE_API_TOKEN }}
