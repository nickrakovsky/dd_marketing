name: Repository Hygiene

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tracked-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reject local-only and generated files
        run: node scripts/check-repository-files.mjs

  campaign-isolation:
    name: Paid-page discovery safeguards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:campaign-isolation
      - run: npm run check:campaign-isolation
