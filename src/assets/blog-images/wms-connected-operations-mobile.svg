<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" role="img" aria-labelledby="wms-mobile-title" aria-describedby="wms-mobile-desc">
  <title id="wms-mobile-title">Keep your WMS. Connect the missing pieces.</title>
  <desc id="wms-mobile-desc">An existing warehouse management system handles inventory, put-away and picking. An API integration connects it to specialist dock scheduling, which coordinates inbound and outbound appointments with carriers and suppliers through bookings and updates.</desc>
  <defs>
    <marker id="wms-mobile-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="m2 2 4 3-4 3" fill="none" stroke="var(--wms-accent, #c9410a)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="480" height="520" rx="12" fill="var(--wms-surface, #f8efdf)"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="var(--wms-ink, #302b25)">
    <text x="28" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="-.3"><tspan x="28">Keep your WMS. </tspan><tspan x="28" dy="30">Connect the missing pieces.</tspan></text>

    <!-- Compact rows keep the diagram proportional to a narrow article column. -->
    <g transform="translate(9 32) scale(.43)">
<path d="M40 215a30 30 0 0 1 30-30h245a30 30 0 0 1 30 30v110H40Z" fill="var(--wms-warehouse-scene, #eee2cc)"/>
